<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUILD AKSAKA - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0F0F1A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(108, 60, 225, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(108, 60, 225, 0.05) 0%, transparent 50%);
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(2%, -2%) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #1A1A2E;
            border-radius: 20px;
            padding: 40px 36px;
            border: 1px solid rgba(108, 60, 225, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(108, 60, 225, 0.05);
            backdrop-filter: blur(10px);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6C3CE1, #8B6FE8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.3);
        }

        .brand-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF, #8B6FE8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-sub {
            display: block;
            font-size: 12px;
            color: #8888A8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
            -webkit-text-fill-color: #8888A8;
        }

        .panel-label {
            text-align: center;
            margin-bottom: 28px;
        }

        .panel-label span {
            font-size: 14px;
            color: #8888A8;
            background: rgba(108, 60, 225, 0.08);
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px solid rgba(108, 60, 225, 0.1);
        }

        .panel-label span i {
            margin-right: 8px;
            color: #6C3CE1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #A0A0B8;
            margin-bottom: 8px;
        }

        .form-group label i {
            margin-right: 8px;
            color: #6C3CE1;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #0F0F1A;
            border: 1px solid #2A2A44;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: #6C3CE1;
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.1);
        }

        .form-control::placeholder {
            color: #555577;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C3CE1, #8B6FE8);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            font-size: 18px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #555577;
        }

        .error-message {
            display: none;
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #FF1744;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 18px;
        }

        .btn-login.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .btn-loading {
            display: flex;
        }

        .btn-loading {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .brand-title {
                font-size: 24px;
            }
            .brand-icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }
            .form-control {
                padding: 12px 16px;
                font-size: 14px;
            }
            .btn-login {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-container">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">
                <i class="fas fa-robot"></i>
            </div>
            <span class="brand-title">BUILD AKSAKA</span>
            <span class="brand-sub">Panel Token</span>
        </div>

        <div class="panel-label">
            <span><i class="fas fa-key"></i> masukkan key akses</span>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Key akses tidak valid!</span>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Key Akses</label>
                <input type="password" id="loginKey" class="form-control" placeholder="Masukkan key Anda..." autofocus>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Masuk</span>
                <span class="btn-loading">
                    <span class="spinner"></span> Memproses...
                </span>
            </button>
        </form>

        <div class="login-footer">
            <span>© 2026 BUILD AKSAKA — All rights reserved</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const session = localStorage.getItem('aksaka_session');
        if (session) {
            try {
                const data = JSON.parse(session);
                if (data.user) {
                    window.location.href = 'index.html';
                    return;
                }
            } catch (e) {}
        }
    })();

    const USERS = [
        { id: 'user_1700000000000', name: 'Admin AKSAKA', key: 'admin123', role: 'Owner' },
        { id: 'user_1700000000001', name: 'Reseller 1', key: 'reseller123', role: 'Reseller' },
    ];

    const loginKeyInput = document.getElementById('loginKey');
    const btnLogin = document.getElementById('btnLogin');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    function handleLogin() {
        const key = loginKeyInput.value.trim();
        errorMessage.classList.remove('show');

        if (!key) {
            showError('Masukkan key akses Anda!');
            loginKeyInput.focus();
            return;
        }

        const user = USERS.find(u => u.key === key);

        if (user) {
            btnLogin.classList.add('loading');
            localStorage.setItem('aksaka_session', JSON.stringify({
                user: user,
                role: user.role
            }));
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        } else {
            showError('Key akses tidak valid! Coba lagi.');
            loginKeyInput.value = '';
            loginKeyInput.focus();
        }
    }

    function showError(message) {
        errorText.textContent = message;
        errorMessage.classList.add('show');
    }

    btnLogin.addEventListener('click', handleLogin);
    loginKeyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
        }
    });
    loginKeyInput.addEventListener('input', () => {
        errorMessage.classList.remove('show');
    });

    console.log('🏗️ BUILD AKSAKA - Login Page');
    console.log('📌 Login: admin123 (Owner) | reseller123 (Reseller)');
</script>

</body>
</html>
